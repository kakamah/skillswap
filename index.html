<!DOCTYPE html>
<html>
<head>
    <title>SkillSwap</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: rgb(78,64,125);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgb(60,50,110);
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            text-align: center;
            width: 400px;
        }
        input, button {
            width: 100%; /* buttons now same width as inputs */
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        input {
            background: rgb(50,50,100); /* navy blue input background */
            border: 1px solid rgb(100,85,160);
            color: white;
        }
        button {
            background: rgb(100,85,160);
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: rgb(120,100,180);
        }
        h1 {
            margin-bottom: 20px;
        }
        .toggle {
            margin: 15px 0;
            color: #aaa;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>SkillSwap</h1>

    <!-- Registration -->
    <form method="POST">
        <input type="hidden" name="action" value="register">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="text" name="grade" placeholder="Grade" required>
        <input type="text" name="can_teach" placeholder="Skills You Can Teach (comma)" required>
        <input type="text" name="want_learn" placeholder="Skills You Want to Learn (comma)" required>
        <button type="submit">Register</button>
    </form>

    <div class="toggle">Already registered? Login below</div>

    <!-- Login -->
    <form method="POST">
        <input type="hidden" name="action" value="login">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
