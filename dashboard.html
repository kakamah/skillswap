<!DOCTYPE html>
<html>
<head>
    <title>SkillSwap Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            margin:0;
            font-family:"Segoe UI",sans-serif;
            background: rgb(78,64,125); /* navy-purple background */
            color:white;
        }
        .header {
            font-size:42px;
            font-weight:700;
            padding:30px 40px;
            background: rgb(60,50,110); /* darker header purple */
        }
        .layout {
            display:flex;
            min-height:100vh;
        }
        .sidebar {
            width:220px;
            background: rgb(60,50,110); /* sidebar purple */
            padding-top:30px;
            display:flex;
            flex-direction:column;
            position:fixed;
            height:100vh;
            left:0;
        }
        .sidebar a {
            padding:15px 25px;
            text-decoration:none;
            color:white;
            font-weight:600;
            transition:0.3s;
        }
        .sidebar a:hover {
            background: rgb(90,75,140); /* sidebar hover */
        }
        .sidebar a.active {
            background: rgb(100,85,160); /* active link */
            color:white;
        }
        .content {
            flex:1;
            padding:40px;
            margin-left:220px;
        }
        .info-banner {
            position:static;
            margin-top:20px;
            width:auto;
            box-shadow:none;
            background: rgb(60,50,110); /* banner background */
            padding:20px;
            border-radius:12px;
            font-size:14px;
            line-height:1.6;
        }
    </style>
</head>
<body>

<div class="header">Hello to SkillSwap!</div>

<div class="layout">
    <div class="sidebar">
        <a href="/dashboard" class="active">Home</a>
        <a href="/profile">Profile</a>
        <a href="/matching">Matches</a>
        <a href="/requests">Requests</a>
        <a href="/chatlist">Chats</a>
        <a href="/logout">Logout</a>
    </div>

    <div class="content">
        <h1>Welcome, {{ user[1] }}</h1>
        <p>Start connecting and exchanging skills.</p>

        <div class="info-banner">
            <strong>💡 What you can do:</strong><br><br>
            • Find people who can teach you new skills<br>
            • Send skill exchange requests<br>
            • Chat and collaborate
        </div>
    </div>
</div>

</body>
</html>
